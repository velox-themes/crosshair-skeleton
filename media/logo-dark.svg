<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Crosshair Skeleton</title>
  <!-- skeleton blocks -->
  <rect x="17" y="20" width="30" height="7" rx="3.5" fill="#3f3f46"/>
  <rect x="17" y="32" width="20" height="7" rx="3.5" fill="#3f3f46"/>
  <!-- selection with corner handles -->
  <rect x="10.5" y="13.5" width="43" height="33" stroke="#fafafa" stroke-width="1.5"/>
  <g fill="#0d1117" stroke="#fafafa" stroke-width="1.5">
    <rect x="7.5" y="10.5" width="6" height="6"/><rect x="50.5" y="10.5" width="6" height="6"/>
    <rect x="7.5" y="43.5" width="6" height="6"/><rect x="50.5" y="43.5" width="6" height="6"/>
  </g>
  <!-- cursor dragging the corner -->
  <path d="M51 48 L62 52 Q62.6 52.3 62 52.6 L57.4 54.4 L55.6 59 Q55.3 59.6 55 59 Z" fill="#fafafa" stroke="#0d1117" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
